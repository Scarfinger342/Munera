# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "icon/icon-512x512.png"

  android: "launcher_icon"
  # # image_path_android: "icon/icon-512x512.png"
  # min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "icon/icon-512x512.png"
  adaptive_icon_foreground_inset: 24
  adaptive_icon_monochrome: "icon/android-monochrome-icon-512x512.png"

  ios: true
  # # image_path_ios: "icon/icon-512x512.png"
  remove_alpha_ios: true
  # # image_path_ios_dark_transparent: "icon/icon_dark.png"
  # # image_path_ios_tinted_grayscale: "icon/icon_tinted.png"
  # # desaturate_tinted_to_grayscale_ios: true
  background_color_ios: "#ffffff"

  web:
    generate: true
    image_path: "icon/icon-512x512.png"

  windows:
    generate: true
    image_path: "icon/icon-512x512.png"
    icon_size: 48 # min:48, max:256, default: 48

  macos:
    generate: true
    image_path: "icon/icon-512x512.png"
  
