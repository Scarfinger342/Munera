name: Build Desktop Binaries

# Only run when a tag (any name) is pushed; also attaches the binaries to a
# GitHub Release.
on:
  push:
    tags: ["*"]

env:
  FLUTTER_VERSION: "3.44.5"

jobs:
  # ---------------------------------------------------------------------
  # WINDOWS
  # ---------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows/x64/runner/Release/

  # ---------------------------------------------------------------------
  # MACOS
  # ---------------------------------------------------------------------
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release

      # Tar (not raw upload) so executable bits survive; upload-artifact
      # zips the file itself, so we don't zip it again.
      - name: Tar artifact
        run: |
          cd build/macos/Build/Products/Release
          tar -czf ../../../../../macos-build.tar.gz *.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: macos-build.tar.gz

  # ---------------------------------------------------------------------
  # LINUX
  # ---------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Tar artifact
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../linux-build.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: linux-build.tar.gz

  # ---------------------------------------------------------------------
  # OPTIONAL: attach all three to a GitHub Release when a tag is pushed
  # ---------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release files
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir release-files
          (cd artifacts/windows-build && zip -r ../../release-files/munera-$VERSION-windows.zip .)
          mv artifacts/macos-build/macos-build.tar.gz release-files/munera-$VERSION-macos.tar.gz
          mv artifacts/linux-build/linux-build.tar.gz release-files/munera-$VERSION-linux.tar.gz

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
